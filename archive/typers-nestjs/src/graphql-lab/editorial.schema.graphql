directive @upper on FIELD_DEFINITION
type SchemaAuthor { id: ID!, name: String!, articles: [SchemaArticle!]! }
type SchemaArticle { id: ID!, title: String! @upper, authorId: ID! }
input SchemaArticleInput { title: String!, authorId: ID! }
type Query { schemaAuthor(id: ID!): SchemaAuthor }
type Mutation { createSchemaArticle(input: SchemaArticleInput!): SchemaArticle! }
